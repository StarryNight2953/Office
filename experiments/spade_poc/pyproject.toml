[project]
name = "office-spade-poc"
version = "0.1.0"
description = "Isolated SPADE communication prototype for Office-kun"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "spade==4.1.4",
    "spade-llm>=0.3.0",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = ["ruff>=0.6,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
